# Alembic config for command-line use, e.g.:
#   alembic revision --autogenerate -m "add column"
#   alembic upgrade head
# The app also runs `upgrade head` automatically at startup.
[alembic]
script_location = storage/migrations
sqlalchemy.url = sqlite:///data/algo.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
