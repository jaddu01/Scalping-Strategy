# IP gateway for the algo platform (see setup.sh). No caching; nothing but the platform may use it.
http_port 172.18.0.1:3129 name=ip_ram
http_port 172.18.0.1:3130 name=ip_mehak

acl platform src 172.16.0.0/12
acl port_ram myportname ip_ram
acl port_mehak myportname ip_mehak
acl SSL_ports port 443
acl CONNECT method CONNECT
acl angel dstdomain .angelone.in .angelbroking.com checkip.amazonaws.com

http_access deny !SSL_ports
http_access deny !platform
http_access allow angel
http_access deny all

tcp_outgoing_address 172.31.11.102 port_ram
tcp_outgoing_address 172.31.0.179 port_mehak

cache deny all
via off
forwarded_for delete
access_log daemon:/var/log/squid/access.log
coredump_dir /var/spool/squid
