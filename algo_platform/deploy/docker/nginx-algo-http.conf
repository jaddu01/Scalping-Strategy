# Stage 1 (before the certificate exists): answer Let's Encrypt's HTTP challenge for the subdomain.
server {
    listen 80;
    server_name algo.cloudusweb.com;

    location /.well-known/acme-challenge/ {
        root /etc/letsencrypt/acme-webroot;
    }
    location / {
        return 503 "algo.cloudusweb.com: HTTPS certificate is being set up\n";
    }
}
