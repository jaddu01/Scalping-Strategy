# algo.cloudusweb.com -> the algo platform container (algo_platform:8000 on the shared Docker network).
# Mounted into the existing nginx container as /etc/nginx/conf.d/algo-platform.conf.
server {
    listen 80;
    server_name algo.cloudusweb.com;

    location /.well-known/acme-challenge/ {
        root /etc/letsencrypt/acme-webroot;   # certificate renewals (certbot --webroot)
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name algo.cloudusweb.com;

    ssl_certificate     /etc/letsencrypt/live/algo.cloudusweb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/algo.cloudusweb.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 50m;   # backtest CSV uploads

    # resolve the container at request time, so nginx (and cloudusweb.com) still starts if the
    # platform container is down
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $algo_upstream http://algo_platform:8000;

    # the first admin is created from the server shell (run.py create-admin), never via the web
    location ~ ^/setup { return 404; }

    location / {
        proxy_pass $algo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # live dashboard WebSocket
        proxy_set_header Connection $connection_upgrade_algo;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, so clients can't spoof their IP
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;                         # long backtests
        proxy_send_timeout 300s;
    }
}

map $http_upgrade $connection_upgrade_algo {
    default upgrade;
    ''      close;
}
